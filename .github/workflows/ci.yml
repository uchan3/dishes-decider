name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同じブランチで新しい push があれば古い実行は止める（無料枠の節約）。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: typecheck / test / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable pnpm
        run: corepack enable pnpm

      # supabase-js (realtime) は Node 22+ のネイティブ WebSocket を要求する。
      # 20 だとテスト収集時に「native WebSocket not found」で落ちる。
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm -r typecheck

      - run: pnpm -r test

      # Cloudflare 側と同じコマンド。デプロイ時に初めて壊れているのを防ぐ。
      - run: pnpm --filter @recipe-planner/web build

  deno:
    name: deno check (edge functions)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # Edge Function はローカルに deno が無いことが多く型検査から漏れるため、ここで見る。
      # core を import map 経由で解決するので設定ファイルを明示する。
      - name: Type check
        working-directory: supabase/functions
        run: deno check --config deno.json ingest/index.ts

  # Supabase Edge Functions は Cloudflare のビルドでは配信されない（あちらは PWA だけ）。
  # 手動デプロイを忘れると、取り込み時のソース作成・食材紐付けなど関数側の変更が
  # 本番に反映されないまま気付けないため、main への push で自動デプロイする。
  #
  # 必要な設定: リポジトリの Secrets に SUPABASE_ACCESS_TOKEN（Supabase の
  # Account → Access Tokens で発行）。未設定なら安全にスキップする。
  # DB マイグレーションは影響が大きいので自動化せず `supabase db push` を手動で行う。
  deploy-functions:
    name: deploy edge functions
    needs: [web, deno]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: mprrxclyflfhkwxocbtb
    steps:
      - uses: actions/checkout@v4

      - name: Check credentials
        id: guard
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "SUPABASE_ACCESS_TOKEN が未設定のためスキップします。" >> "$GITHUB_STEP_SUMMARY"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: supabase/setup-cli@v1
        if: steps.guard.outputs.skip != 'true'
        with:
          version: latest

      - name: Deploy ingest
        if: steps.guard.outputs.skip != 'true'
        run: supabase functions deploy ingest --project-ref "$PROJECT_REF"
